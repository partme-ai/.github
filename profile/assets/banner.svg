<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PartMe AI banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#312e81" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Neural network nodes (right) -->
  <g transform="translate(1050, 160)" opacity="0.40">
    <g fill="#a5b4fc">
      <circle cx="0" cy="-60" r="6"/>
      <circle cx="-40" cy="-30" r="6"/>
      <circle cx="40" cy="-30" r="6"/>
      <circle cx="-50" cy="20" r="6"/>
      <circle cx="50" cy="20" r="6"/>
      <circle cx="-30" cy="60" r="6"/>
      <circle cx="30" cy="60" r="6"/>
      <circle cx="0" cy="0" r="8"/>
    </g>
    <g stroke="#a5b4fc" stroke-width="1" opacity="0.6" fill="none">
      <line x1="0" y1="-60" x2="0" y2="0"/>
      <line x1="-40" y1="-30" x2="0" y2="0"/>
      <line x1="40" y1="-30" x2="0" y2="0"/>
      <line x1="-50" y1="20" x2="0" y2="0"/>
      <line x1="50" y1="20" x2="0" y2="0"/>
      <line x1="-30" y1="60" x2="0" y2="0"/>
      <line x1="30" y1="60" x2="0" y2="0"/>
    </g>
  </g>

  <!-- Title -->
  <text x="100" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-2">PartMe AI</text>

  <!-- Subtitle -->
  <text x="104" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="400" fill="#e0e7ff" letter-spacing="0.5">
    Agent-driven application development ecosystem
  </text>

  <!-- Tagline -->
  <text x="104" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="300" fill="#a5b4fc" letter-spacing="1">
    LLMs · Prompt Engineering · Agents · MCP · Skills · RAG
  </text>

  <!-- Top brand badge -->
  <g transform="translate(104, 250)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#fbbf24" opacity="0.95"/>
    <text x="120" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">
      Top-level brand · Ecosystem root
    </text>
  </g>

  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>