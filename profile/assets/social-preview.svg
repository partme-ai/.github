<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="PartMe AI social preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#312e81"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Large neural network (right) -->
  <g transform="translate(1020, 320)" opacity="0.30">
    <g fill="#a5b4fc">
      <circle cx="0" cy="-160" r="14"/>
      <circle cx="-100" cy="-80" r="14"/>
      <circle cx="100" cy="-80" r="14"/>
      <circle cx="-130" cy="50" r="14"/>
      <circle cx="130" cy="50" r="14"/>
      <circle cx="-80" cy="160" r="14"/>
      <circle cx="80" cy="160" r="14"/>
      <circle cx="0" cy="0" r="20"/>
    </g>
    <g stroke="#a5b4fc" stroke-width="2" opacity="0.6" fill="none">
      <line x1="0" y1="-160" x2="0" y2="0"/>
      <line x1="-100" y1="-80" x2="0" y2="0"/>
      <line x1="100" y1="-80" x2="0" y2="0"/>
      <line x1="-130" y1="50" x2="0" y2="0"/>
      <line x1="130" y1="50" x2="0" y2="0"/>
      <line x1="-80" y1="160" x2="0" y2="0"/>
      <line x1="80" y1="160" x2="0" y2="0"/>
    </g>
  </g>

  <!-- Title -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="120" font-weight="800" fill="url(#title)" letter-spacing="-3">PartMe AI</text>

  <!-- Subtitle -->
  <text x="104" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="400" fill="#e0e7ff" letter-spacing="0.5">
    Agent-driven application development ecosystem
  </text>

  <!-- Tagline -->
  <text x="104" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="300" fill="#a5b4fc" letter-spacing="2">
    LLMs · Agents · MCP · Skills · RAG · Tools
  </text>

  <!-- Top brand badge -->
  <g transform="translate(104, 460)">
    <rect x="0" y="0" width="320" height="50" rx="25" fill="#fbbf24"/>
    <text x="160" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#1e1b4b" text-anchor="middle">
      Top-level brand · Ecosystem root
    </text>
  </g>

  <rect x="0" y="628" width="1280" height="12" fill="url(#title)"/>
</svg>